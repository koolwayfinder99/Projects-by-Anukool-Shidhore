# Joint Controller Configuration for ROS2 Control
# Controls effort command distribution and feedback

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    
    arm_trajectory_controller:
      type: effort_controllers/JointTrajectoryController
      
      joints:
        - joint_1
        - joint_2
        - joint_3
        - joint_4
        - joint_5
        - joint_6
        
      gains:
        joint_1: {p: 100.0, d: 50.0, i: 0.0}
        joint_2: {p: 100.0, d: 50.0, i: 0.0}
        joint_3: {p: 80.0, d: 40.0, i: 0.0}
        joint_4: {p: 80.0, d: 40.0, i: 0.0}
        joint_5: {p: 80.0, d: 40.0, i: 0.0}
        joint_6: {p: 60.0, d: 30.0, i: 0.0}

# Effort limits and safety parameters
joint_limits:
  effort:
    joint_1: 150.0
    joint_2: 150.0
    joint_3: 120.0
    joint_4: 100.0
    joint_5: 100.0
    joint_6: 80.0
    
  velocity:
    joint_1: 3.14
    joint_2: 3.14
    joint_3: 3.14
    joint_4: 4.71
    joint_5: 4.71
    joint_6: 4.71

# Predictive maintenance threshold configuration
maintenance:
  degradation_thresholds:
    warning: 50.0    # Percentage
    critical: 80.0   # Percentage
    
  anomaly_detection:
    contamination: 0.1  # Estimated anomaly percentage
    n_estimators: 100
    
  feature_window_size: 20  # Samples for rolling window
  update_frequency: 10     # Hz
